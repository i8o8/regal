<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8f7f5" />
      <stop offset="100%" stop-color="#f4f3f1" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="turb" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="overlay" in2="SourceGraphic" />
    </filter>
    <pattern id="subtle-diagonal" patternUnits="userSpaceOnUse" width="80" height="80">
      <rect width="80" height="80" fill="transparent" />
      <path d="M-10 10 L10 -10 M70 90 L90 70" stroke="#efece8" stroke-width="1" stroke-linecap="square" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#heroGrad)" />
  <rect width="100%" height="100%" fill="url(#subtle-diagonal)" opacity="0.65" />

  <!-- soft vignette -->
  <ellipse cx="800" cy="300" rx="700" ry="350" fill="black" opacity="0.02" />

  <!-- subtle center highlight -->
  <circle cx="1100" cy="220" r="160" fill="#fff" opacity="0.08" />

  <!-- decorative wave -->
  <path d="M0,540 C320,420 640,680 960,560 C1280,440 1600,620 1600,620 L1600,900 L0,900 Z" fill="#fff" opacity="0.04" />

  <!-- small texture overlay -->
  <rect width="100%" height="100%" fill="rgba(0,0,0,0.02)" />
</svg>
