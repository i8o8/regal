<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" preserveAspectRatio="none">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#f7f6f4"/>
      <circle cx="2" cy="2" r="1.5" fill="#efece8" />
    </pattern>
    <linearGradient id="soft-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.98)"/>
      <stop offset="100%" stop-color="rgba(250,250,248,0.98)"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <rect width="100%" height="100%" fill="url(#soft-grad)" />
</svg>
