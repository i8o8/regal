<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      
      @keyframes pulse {
        0%, 100% { r: 6px; fill-opacity: 1; }
        50% { r: 10px; fill-opacity: 0.4; }
      }
      
      @keyframes flowData {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(52,87,124,0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(52,87,124,0.8)); }
      }
      
      .node {
        animation: float 4s ease-in-out infinite;
      }
      
      .node-1 { animation-delay: 0s; }
      .node-2 { animation-delay: 0.5s; }
      .node-3 { animation-delay: 1s; }
      .node-4 { animation-delay: 1.5s; }
      
      .pulse-node {
        animation: pulse 2s ease-in-out infinite;
      }
      
      .pulse-1 { animation-delay: 0s; }
      .pulse-2 { animation-delay: 0.4s; }
      .pulse-3 { animation-delay: 0.8s; }
      .pulse-4 { animation-delay: 1.2s; }
      
      .data-line {
        stroke: #34577c;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 10, 10;
        animation: flowData 3s linear infinite;
      }
      
      .data-line-1 { animation-delay: 0s; }
      .data-line-2 { animation-delay: 0.5s; }
      .data-line-3 { animation-delay: 1s; }
      
      .accent-glow {
        animation: glow 3s ease-in-out infinite;
      }
      
      .glow-1 { animation-delay: 0s; }
      .glow-2 { animation-delay: 0.6s; }
      .glow-3 { animation-delay: 1.2s; }
    </style>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef4fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34577c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#284662;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Top Left Node -->
  <g class="node node-1">
    <circle cx="80" cy="100" r="30" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle cx="80" cy="100" r="20" fill="rgba(52,87,124,0.1)"/>
    <circle class="pulse-node pulse-1" cx="80" cy="100" r="6" fill="#34577c"/>
    <text x="80" y="110" font-size="12" fill="#34577c" text-anchor="middle" font-weight="600">Data</text>
  </g>
  
  <!-- Center Top Node -->
  <g class="node node-2">
    <circle cx="200" cy="80" r="30" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle cx="200" cy="80" r="20" fill="rgba(52,87,124,0.1)"/>
    <circle class="pulse-node pulse-2" cx="200" cy="80" r="6" fill="#34577c"/>
    <text x="200" y="90" font-size="12" fill="#34577c" text-anchor="middle" font-weight="600">AI</text>
  </g>
  
  <!-- Top Right Node -->
  <g class="node node-3">
    <circle cx="320" cy="100" r="30" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle cx="320" cy="100" r="20" fill="rgba(52,87,124,0.1)"/>
    <circle class="pulse-node pulse-3" cx="320" cy="100" r="6" fill="#34577c"/>
    <text x="320" y="110" font-size="12" fill="#34577c" text-anchor="middle" font-weight="600">Tech</text>
  </g>
  
  <!-- Center Large Node -->
  <g class="node node-4 accent-glow glow-1">
    <circle cx="200" cy="280" r="45" fill="rgba(52,87,124,0.05)" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="200" cy="280" r="35" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle class="pulse-node pulse-4" cx="200" cy="280" r="8" fill="#34577c"/>
    <text x="200" y="285" font-size="14" fill="#34577c" text-anchor="middle" font-weight="700">Marketing</text>
  </g>
  
  <!-- Bottom Left Node -->
  <g class="node node-1 accent-glow glow-2">
    <circle cx="100" cy="420" r="28" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle cx="100" cy="420" r="18" fill="rgba(52,87,124,0.1)"/>
    <circle class="pulse-node pulse-1" cx="100" cy="420" r="6" fill="#34577c"/>
    <text x="100" y="430" font-size="11" fill="#34577c" text-anchor="middle" font-weight="600">Strategy</text>
  </g>
  
  <!-- Bottom Right Node -->
  <g class="node node-2 accent-glow glow-3">
    <circle cx="300" cy="420" r="28" fill="rgba(238,244,250,1)" stroke="#34577c" stroke-width="2"/>
    <circle cx="300" cy="420" r="18" fill="rgba(52,87,124,0.1)"/>
    <circle class="pulse-node pulse-2" cx="300" cy="420" r="6" fill="#34577c"/>
    <text x="300" y="430" font-size="11" fill="#34577c" text-anchor="middle" font-weight="600">Growth</text>
  </g>
  
  <!-- Connection Lines with Data Flow -->
  <!-- Top Left to Center -->
  <path class="data-line data-line-1" d="M 110 120 Q 155 150 170 235"/>
  
  <!-- Top Center to Center -->
  <path class="data-line data-line-2" d="M 200 110 L 200 235"/>
  
  <!-- Top Right to Center -->
  <path class="data-line data-line-3" d="M 290 120 Q 245 150 230 235"/>
  
  <!-- Center to Bottom Left -->
  <path class="data-line data-line-1" d="M 170 315 Q 135 360 115 392"/>
  
  <!-- Center to Bottom Right -->
  <path class="data-line data-line-2" d="M 230 315 Q 265 360 285 392"/>
  
  <!-- Secondary flowing connections -->
  <path class="data-line data-line-3" d="M 80 130 Q 140 200 100 392" opacity="0.5"/>
  <path class="data-line data-line-1" d="M 320 130 Q 260 200 300 392" opacity="0.5"/>
  
  <!-- Decorative accent circles -->
  <circle cx="200" cy="200" r="3" fill="#34577c" opacity="0.6"/>
  <circle cx="200" cy="250" r="3" fill="#34577c" opacity="0.4"/>
  
  <!-- Corner accent marks -->
  <g opacity="0.3">
    <line x1="20" y1="40" x2="50" y2="40" stroke="#34577c" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="20" y2="60" stroke="#34577c" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g opacity="0.3">
    <line x1="380" y1="460" x2="350" y2="460" stroke="#34577c" stroke-width="2" stroke-linecap="round"/>
    <line x1="380" y1="460" x2="380" y2="440" stroke="#34577c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
